# Everything specific to one Minecraft version lives here. Adding a target means adding a sibling
# directory and naming it in settings.gradle.kts, not editing this file.

# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
neo_version_range=[21.1.235,)
loader_version_range=[4,)

# Parchment parameter names and javadoc, layered on top of the official Mojang mappings.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# YetAnotherConfigLib draws the config screen. Optional at runtime: without it the mod works and
# only the screen is unavailable. https://modrinth.com/mod/yacl
yacl_version=3.8.1+1.21.1-neoforge
yacl_min_version=3.6
