minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.12-beta
neo_version_range=[26.3.0.12-beta,)
loader_version_range=[4,)

yacl_version=3.9.7+26.3-neoforge
yacl_min_version=3.9.7

# The only NeoForge build of YACL for 26.3 declares Minecraft [26.2,26.3), so NeoForge will not load it on
# 26.3. It is still compiled against, so the config screen turns up as soon as a build that accepts 26.3 is
# out, but it is kept out of the development client, which would otherwise refuse to start.
yacl_dev_runtime=false
