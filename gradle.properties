# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Mod Properties
# Per-version properties live in versions/<target>/gradle.properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# This is also the resource namespace packs address, so it is deliberately short and has no separator.
mod_id=treadlightly
# The human-readable display name for the mod.
mod_name=Tread Lightly
# The license of the mod, as an SPDX identifier. LICENSE holds the LGPL v3 text, which
# incorporates COPYING (GPL v3) by reference.
mod_license=LGPL-3.0-or-later
# The mod version. See https://semver.org/
mod_version=1.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=com.aspctt.treadlightly
# Base name of the built jar, published as <archives_name>-<mod_version>+<minecraft_version>.jar
archives_name=TreadLightly
